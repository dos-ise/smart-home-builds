            <div class="grid-line sprite_4x2_repeating_gc4_grid_line">

                        <div data-bind="if: armToStayReady, click: clickArmTostay">
                            <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_252">
                                <div data-bind="click: clickArmTostay"></div>
                            </div>
                            <div class="arm-button-labels">
                                <span class="t3lsg" data-bind="html: i18n.al2_turnOnArmedToStay_btnLabel"></span>
                            </div>
                        </div>
                        <!-- /armToStay button, ACTIVE -->

                        <!-- armToStay button, IN-ACTIVE with yellow info button -->

                            <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_252">
                                <div disabled="true"></div>
                                <div class="armNotPossibleBadge" data-bind="click: clickArmButtonNotPossibleBadge"></div>
                            </div>
                            <div class="arm-button-labels">
                                <span class="t3lsg" data-bind="text: i18n.al2_turnOnArmedToStay_btnLabel"></span>
                            </div>
                        </div>
                        <!-- /armToStay button, IN-ACTIVE with yellow info button -->

                        <!-- armAway should be shown only, if inevitabilityMode = false; -->

                        <!-- ko ifnot: inevitabilityMode -->
                            <!-- armAway button, ACTIVE -->
                            <div data-bind="if: armAwayReady, click: clickArmAway">
                                <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_251">
                                    <div data-bind="click: clickArmAway"></div>
                                </div>
                                <div class="arm-button-labels">
                                    <span class="t3lsg" data-bind="text: i18n.al2_turnOnArmedAway_btnLabel"></span>
                                </div>
                            </div>
                            <!-- /armAway button, ACTIVE -->

                            <!-- armAway button, IN-ACTIVE with yellow info button -->
                            <div data-bind="ifnot: armAwayReady">
                                <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_251">
                                    <div disabled="true"></div>
                                    <div class="armNotPossibleBadge" data-bind="click: clickArmButtonNotPossibleBadge"></div>
                                </div>
                                <div class="arm-button-labels">
                                    <span class="t3lsg" data-bind="text: i18n.al2_turnOnArmedAway_btnLabel"></span>
                                </div>
                            </div>
                        <!-- /ko -->
                        <!-- /armAway button, IN-ACTIVE with yellow info button -->
                    </div>

                    <div data-bind="if: armState1or2">
                        <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_8" data-bind="click: clickDisarm"/>
                        <div class="arm-button-labels">
                            <span class="t3lsg" data-bind="text: i18n.al2_disarm_btnLabel"></span>
                        </div>
                    </div>
                    <div data-bind="if: cancelWithDisarm">
                        <!-- Eintrittsverzögerung abbrechen-->
                        <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_8" data-bind="click: clickDisarm"/>
                        <div class="arm-button-labels">
                            <span class="t3lsg" data-bind="text: i18n.al2_cancelAlarm_btnLabel"></span>
                        </div>
                    </div>
                </div><!-- /ifnot: alarm24h -->

                <div data-bind="if: alarm24h">
                    <div class="arm-button arm-button-normal arm-buttonIcon center-icon gc4_icons_grid_264" data-bind="click: clickResolveAlarms"/>
                    <div class="arm-button-labels">
                        <span class="t3lsg" data-bind="text: i18n.al2_resolveAlarm_btnLabel"></span>
                    </div>
                </div>
        </div>

        <!-- keyboard -->
        <div class="al2pinKeyboard" data-bind="visible: al2pinKeyboardIsVisible(), attr: { id: al2pinKeyboardHTMLId }">
            <!-- keyboard title -->
            <div id="kb-title"><span data-bind="text: keyboardTitleText"></span></div>
            <div class="3c3c3c">
                <p class="kbPinCircleTitle"><span data-bind="text: i18n.al2_please_enter_4pin_code"></span>!</p>

                    <div id="pinSpinner" data-bind="visible: pinSpinner"><img src="alarmSystem2/imgs/pinSpinner.svg" height="20" width="20"/></div>
                </div>
            </div>
            <div style="width: 100%; height: 100%; background-color: white;">
                <div style="margin: 20px 20px 20px 20px;">
                    <div>
                        <div class="button button_wide_numeric" data-bind="click: kb1Pressed">

                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb2Pressed">

                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb3Pressed">

                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb4Pressed">
                            <div class="key">4</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb5Pressed">
                            <div class="key">5</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb6Pressed">
                            <div class="key">6</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb7Pressed">
                            <div class="key">7</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb8Pressed">
                            <div class="key">8</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb9Pressed">
                            <div class="key">9</div>
                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kbEscPressed">

                        </div>
                        <div class="button button_wide_numeric" data-bind="click: kb0Pressed">

                        </div>
                        <div class="button button_wide_numeric delete-icon" data-bind="click: kbBackPressed">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /keyboard -->
    </div>
</script>

                            <div data-automation-id="statusBarIcon" class="status-bar-icon status-alert-icon" data-bind="visible: errorIcon.show, event: {click: errorIcon.click}"></div>
                            <!-- ko foreach: iconList-->
                            <div data-automation-id="statusBarIcon" class="status-bar-icon" data-bind="event: {click: click}, css: icon"></div>
                            <!-- /ko -->
                            <div data-automation-id="statusBarTime" class="time status-element" data-bind="text: time, visible: showDateTime"></div>
                            <div data-automation-id="statusBarDate" class="date status-element" data-bind="text: date, visible: showDateTime"></div>
                        </div>
                    </div>
                    <div id="branding-row" data-automation-id="brandingRow">
                        <div id="title" class="layoutHeadline t1sw" data-bind="text: currentHeadlineLabel"></div>
                        <div class="branding-row-touchable" data-bind="click: onTouch"></div>
                    </div>
                    <div id="navbar">
                        <div class="navbar-table">
                            <div id="btnBack" data-automation-id="backBtn" class="btnBack" data-bind="giraHeaderButtons: {callback: goBack, isEnabled: canGoBack}" role="button" tabindex="0">
                                <div class="btnHomeSprite" data-bind="css: (canGoBack() ? 'gc4_navicon_back' : 'gc4_navicon_back_inactive')"></div>
                            </div>
                            <div id="btnHome" data-automation-id="homeBtn" class="btnHome" data-bind="giraHeaderButtons: {callback: goHome, isEnabled: canGoHome}" role="button" tabindex="1">
                                <div class="btnHomeSprite" data-bind="css: (canGoHome() ? 'gc4_navicon_home' : 'gc4_navicon_home_inactive')"></div>
                            </div>
                            <!--<div id="btnFavorite" class="btnHome" data-bind="giraHeaderButtons: {callback: goToFavorite}">
                                <div class="btnHomeSprite gc4_navicon_favorite"></div>
                            </div>-->
                            <div class="btnSettings" data-automation-id="settingsBtn" data-bind="giraHeaderButtons: {callback: toggleSettings, isEnabled: function () { return true; }}, css: (isSettingsActive() ? 'active' : '')" role="button" tabindex="2">
                                <div class="button-container-image" data-bind="css: (isSettingsActive() ? 'gc4_navicon_set_active' : 'gc4_navicon_set')"></div>
                            </div>
                            <!-- ko if: window.Gira.Globals.isStandaloneDcs() -->
                            <div class="btnGridMode" data-automation-id="gridBtn" data-bind="giraHeaderButtons: {callback: function () {return false;}, isEnabled: function () {return false;}}" role="button" tabindex="3">
                                <div class="button-container-image gc4_navicon_grid_inactive"></div>
                            </div>
                            <!-- /ko -->
                            <!-- ko if: !window.Gira.Globals.isStandaloneDcs() -->
                            <div class="btnGridMode" data-automation-id="gridBtn" data-bind="giraHeaderButtons: {callback: toggleDetailView, isEnabled: isDetailViewEnabled}, css: (showDetailView() || isSettingsActive() ? '' : 'active')" role="button" tabindex="3">
                                <div class="button-container-image" data-bind="css: (isDetailViewEnabled() ? (showDetailView() ? 'gc4_navicon_grid' : 'gc4_navicon_grid_active') : 'gc4_navicon_grid_inactive')"></div>
                            </div>
                            <!-- /ko -->
                        </div>
                    </div>
                    <div id="content-container" data-automation-id="contentContainer">
                        <div data-automation-id="content" id="content" data-bind="template: 'gira-content-container'">
                        </div>
                        <div id="split-content" style="display: none">
                            <div class="split-content-left">
                            </div>
                            <div class="split-content-right">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="hidden-content" style="display:none;">
                </div>
                <div id="preloaded-svg" style="width: 0; height: 0">
                </div>
            </div>
        </div>

        <div id="overlay" data-automation-id="overlay" data-bind="visible: isVisible, css: {'primary-function-fadeIn': overlayState() === 'opening','primary-function-fadeOut': overlayState() === 'closing'}" style="display: none">
            <!-- ko if: $data.isVisible -->
            <div class="overlay-control" data-bind="template: {name: overlayTemplate, data:$data}"></div>
            <!-- /ko -->
        </div>
        <div data-automation-id="firstConnectionWizard" id="wizard-overlay" style="display: none" data-bind="visible: isVisible">
            <!-- ko template: 'wizard-overlay-template' -->
            <!-- /ko -->
        </div>
        <div id="mighty-wizard-overlay" style="display: none" data-bind="visible: isVisible">
            <!-- ko template: 'wizard-overlay-template' -->
            <!-- /ko -->
        </div>
        <div id="catchFirstTouchOverlay" data-bind="css: {'steal-touch': stealTouchNow}, click: firstTouchHappened">
        </div>
    </body>
</html>
